# SÓ DEV LOCAL. Sem esta política o CLI encerra a instância assim que a resposta
# sai, e a tarefa despachada por `EdgeRuntime.waitUntil` no `webhook-whatsapp`
# (Fase C) nunca completa em `supabase functions serve` — o exercício manual da
# ingestão assíncrona mediria um caminho que nunca roda. Não tem efeito em
# produção, onde o runtime é gerenciado.
[edge_runtime]
policy = "per_worker"

[functions.webhook-whatsapp]
verify_jwt = false

[functions.create-reservation]
verify_jwt = false

[functions.public-waitlist]
verify_jwt = false

# Reserva manual pelo painel: invocada pelo frontend autenticado. JWT validado
# no gateway + re-checado no código (is_unit_member/is_platform_admin).
[functions.create-manual-reservation]
verify_jwt = true

[functions.webhook-zapi]
verify_jwt = false

[functions.send-whatsapp]
verify_jwt = false

# Reenvio do painel "Entregas": auth própria (JWT de unit member) — verify_jwt=false
# pra ela validar membership internamente, igual send-whatsapp.
[functions.resend-notification]
verify_jwt = false

[functions.send-confirmation]
verify_jwt = false

[functions.send-manual-message]
verify_jwt = false

[functions.send-cancellation]
verify_jwt = false

# Mesa pronta pelo painel: JWT conferido novamente na EF com a unidade do recurso.
[functions.notify-waitlist-ready]
verify_jwt = false

[functions.whatsapp-health]
verify_jwt = true

[functions.update-reservation]
verify_jwt = false

# Workers internos chamados via pg_cron com x-internal-key. JWT default novo
# (verify_jwt=true) bloqueia no gateway antes de chegar no requireInternalAuth.
[functions.process-notification-outbox]
verify_jwt = false

[functions.process-voucher-triggers]
verify_jwt = false

[functions.process-reservation-reminders]
verify_jwt = false

[functions.process-satisfaction-surveys]
verify_jwt = false

[functions.process-waitlist-entered]
verify_jwt = false

[functions.process-waitlist-feedback]
verify_jwt = false

[functions.cleanup-orphan-assets]
verify_jwt = false

[functions.manage-channels]
verify_jwt = true

[functions.manage-members]
verify_jwt = true

[functions.manage-organizations]
verify_jwt = true

[functions.manage-ai-providers]
verify_jwt = true

# Billing: gestão de mensalidades (super-admin)
[functions.manage-billing]
verify_jwt = true

# Stripe: secrets da plataforma (super-admin)
[functions.manage-platform-secrets]
verify_jwt = true

# Stripe: CRUD da conta Connect (super-admin)
[functions.manage-stripe-accounts]
verify_jwt = true

# Stripe: cria Checkout Session (público, sem JWT)
[functions.create-checkout-session]
verify_jwt = false

# Stripe: cria Checkout Session de billing (subscription/setup) — self-service
[functions.create-billing-checkout]
verify_jwt = true

# Stripe: gestão de payment_methods (list/set_default por owner, delete só admin)
[functions.manage-payment-methods]
verify_jwt = true

# Stripe: webhook handler (assinatura Stripe, sem JWT)
[functions.stripe-webhook]
verify_jwt = false

# Asaas: webhook handler (token estático no header, sem HMAC — sem JWT).
# Sem esta entrada o gateway responde 401 antes do handler rodar, e cada 401
# conta como falha de entrega pro Asaas (15 seguidas interrompem a fila).
[functions.asaas-webhook]
verify_jwt = false

# Worker: cancela reservas com pagamento expirado (pg_cron)
[functions.expire-pending-payments]
verify_jwt = false

# Workers de billing (pg_cron)
[functions.process-billing-overdue]
verify_jwt = false

[functions.process-billing-reminders]
verify_jwt = false

[functions.process-billing-reconcile]
verify_jwt = false

[functions.process-billing-unblock]
verify_jwt = false

# Worker: expira trial automático ao vencer e bloqueia org (pg_cron 03:00 UTC)
[functions.process-trial-expiry]
verify_jwt = false

# Worker: reprocessa billing_events Asaas presos received/failed (pg_cron 07:00 UTC)
[functions.process-asaas-reconcile]
verify_jwt = false

# Worker: reconcilia cobranças do Asaas com billing_invoices por assinatura
# (pg_cron 08:00 UTC). Obrigatório explicitar — CLI >=2.95 default vira true e
# o gateway responde 401 antes do requireInternalAuth, cron silencia.
[functions.process-asaas-invoice-reconcile]
verify_jwt = false

# Worker: dispatcher da fila billing_notifications via Resend (pg_cron */5min)
[functions.process-billing-notifications]
verify_jwt = false

# Painel da implantação do WhatsApp (super-admin, com uma action client-friendly)
[functions.manage-whatsapp-implementations]
verify_jwt = true

# Worker: suspende/restaura o serviço de WhatsApp por inadimplência da
# mensalidade da instância (pg_cron diário 11:00 UTC). Obrigatório explicitar
# — CLI >=2.95 default vira true e o gateway responde 401 antes do
# requireInternalAuth, cron silencia.
[functions.process-whatsapp-enforcement]
verify_jwt = false

# Painel administrativo do inventário de instâncias Z-API (Fase 6b, super-admin).
# verify_jwt explícito como defesa em profundidade — a EF valida platform_admin
# por conta própria, e o gateway barra antes.
[functions.manage-whatsapp-instances]
verify_jwt = true

# Worker: rolagem de ciclo, alertas e divergências da instância Z-API
# (pg_cron 12:10 UTC). Obrigatório explicitar — CLI >=2.95 default vira true e
# o gateway responde 401 antes do requireInternalAuth, cron silencia.
[functions.process-whatsapp-instance-cycles]
verify_jwt = false

# Worker: observação periódica da conexão dos canais (pg_cron a cada 5 min).
# Terceiro escritor de `whatsapp_channels.status`, e o único que não depende de
# callback do provider nem de aba aberta — ver o cabeçalho da função.
[functions.process-whatsapp-channel-health]
verify_jwt = false

# Capability pública restrita a opt-out; SQL continua service-only.
[functions.whatsapp-message-preferences]
verify_jwt = false
# Worker interno: requireInternalAuth valida a chave atual.
[functions.process-whatsapp-templates]
verify_jwt = false

[functions.process-whatsapp-automations]
verify_jwt = false
[functions.send-scheduled-whatsapp]
verify_jwt = false

# Receptor interno de alertas operacionais: autenticação própria via x-ops-alert-key.
[functions.whatsapp-ops-alert-email]
verify_jwt = false

# Current getUser authentication and genuine caller JWT SQL authorization.
[functions.manage-whatsapp-templates]
verify_jwt = false
